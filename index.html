<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apex Lift - Mobile Gym Workout Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Prevent rubber-banding / horizontal scrolling */
    html, body {
      overscroll-behavior-y: contain;
      -webkit-tap-highlight-color: transparent;
    }
    /* Hide spin buttons for numeric inputs */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col selection:bg-emerald-500 selection:text-white">

  <!-- Header / Navigation Bar -->
  <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-950/50">
          <svg class="w-4 h-4 text-slate-950 font-bold" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base font-bold tracking-tight text-white leading-none">ApexLift</h1>
          <p class="text-[10px] text-slate-400 font-medium tracking-wider uppercase mt-0.5">Gym Tracker</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button id="tabWorkoutBtn" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm bg-emerald-600 text-white min-h-[36px] flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
          Workout
        </button>
        <button id="tabHistoryBtn" type="button" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 min-h-[36px] flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          History
          <span id="historyBadge" class="ml-0.5 px-1.5 py-0.2 bg-slate-800 text-slate-300 rounded-full text-[10px] font-bold">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28">

    <!-- VIEW: WORKOUT LOGGER -->
    <section id="workoutView" class="space-y-4">
      
      <!-- Auto-Save Status Bar -->
      <div class="flex items-center justify-between text-xs px-1 text-slate-400">
        <div class="flex items-center gap-1.5">
          <span id="saveIndicatorDot" class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="saveStatusText" class="text-slate-400 font-medium">Auto-saved to device</span>
        </div>
        <button id="resetWorkoutBtn" type="button" class="text-xs text-slate-500 hover:text-rose-400 transition-colors py-1 px-2 rounded hover:bg-slate-900 flex items-center gap-1">
          <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3" />
          </svg>
          Clear
        </button>
      </div>

      <!-- Workout Header Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3.5">
        
        <!-- Date Picker Row -->
        <div>
          <label for="workoutDate" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
            Workout Date
          </label>
          <div class="relative">
            <input type="date" id="workoutDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-100 min-h-[44px] focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
          </div>
        </div>

        <!-- Workout Routine / Name -->
        <div>
          <label for="workoutName" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1.5">
            Routine Name
          </label>
          <input type="text" id="workoutName" placeholder="e.g., Push, Pull, Legs, Upper..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-100 placeholder-slate-600 min-h-[44px] focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all">
          
          <!-- Quick Preset Chips -->
          <div class="mt-2.5 flex flex-wrap gap-1.5">
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Push">Push</button>
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Pull">Pull</button>
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Legs">Legs</button>
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Upper">Upper</button>
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Lower">Lower</button>
            <button type="button" class="preset-chip px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-300 min-h-[36px] transition-all" data-name="Full Body">Full Body</button>
          </div>
        </div>

      </div>

      <!-- Exercises List Container -->
      <div id="exercisesContainer" class="space-y-4">
        <!-- Exercise cards injected dynamically -->
      </div>

      <!-- Add Exercise Trigger Button -->
      <button id="openAddExerciseBtn" type="button" class="w-full bg-slate-900/90 hover:bg-slate-850 active:scale-[0.99] border-2 border-dashed border-slate-750 hover:border-emerald-500/60 rounded-2xl p-4 flex items-center justify-center gap-2 text-slate-300 hover:text-emerald-400 font-semibold text-sm min-h-[52px] transition-all shadow-sm">
        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Add Exercise
      </button>

    </section>

    <!-- VIEW: RECENT WORKOUT HISTORY -->
    <section id="historyView" class="hidden space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-bold text-white">Recent Workouts</h2>
          <p class="text-xs text-slate-400">Last 5 completed sessions saved locally</p>
        </div>
        <button id="clearHistoryBtn" type="button" class="text-xs text-slate-500 hover:text-rose-400 transition-colors py-1.5 px-2.5 rounded-lg border border-slate-800 hover:border-rose-900/50">
          Clear History
        </button>
      </div>

      <div id="historyList" class="space-y-3">
        <!-- Rendered dynamically -->
      </div>
    </section>

  </main>

  <!-- Sticky Bottom Finish Bar (visible on Workout Tab) -->
  <div id="bottomBar" class="fixed bottom-0 left-0 right-0 z-30 bg-slate-950/95 backdrop-blur-md border-t border-slate-800/80 p-3.5">
    <div class="max-w-md mx-auto flex items-center gap-3">
      <div class="flex-1">
        <div class="text-[11px] text-slate-400 font-medium uppercase tracking-wider">Completed Sets</div>
        <div id="completedSetsCounter" class="text-sm font-bold text-emerald-400">0 of 0 sets done</div>
      </div>
      <button id="finishWorkoutBtn" type="button" class="bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 active:scale-[0.98] text-slate-950 font-bold px-6 py-3 rounded-xl min-h-[48px] shadow-lg shadow-emerald-950/60 flex items-center justify-center gap-2 text-sm transition-all disabled:opacity-50 disabled:pointer-events-none">
        <span id="finishBtnText">Finish Workout</span>
        <svg id="finishBtnSpinner" class="hidden w-4 h-4 animate-spin text-slate-950" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- ADD EXERCISE MODAL / DRAWER -->
  <div id="exerciseModal" style="display: none !important;" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col space-y-4 animate-in slide-in-from-bottom duration-200">
      <div class="flex items-center justify-between pb-2 border-b border-slate-800">
        <h3 class="text-base font-bold text-white">Select or Type Exercise</h3>
        <button id="closeExerciseModalBtn" type="button" class="p-2 text-slate-400 hover:text-white rounded-lg min-h-[44px] min-w-[44px] flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Custom Input -->
      <div>
        <label for="customExerciseInput" class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">
          Exercise Name
        </label>
        <div class="flex gap-2">
          <input type="text" id="customExerciseInput" placeholder="e.g. Incline Dumbbell Press" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 min-h-[44px] focus:outline-none focus:border-emerald-500">
          <button id="confirmCustomExerciseBtn" type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 rounded-xl text-sm min-h-[44px]">
            Add
          </button>
        </div>
      </div>

      <!-- Quick Exercise Directory -->
      <div class="flex-1 overflow-y-auto space-y-2 pr-1">
        <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Popular Exercises</div>
        <div class="grid grid-cols-2 gap-2" id="presetExerciseGrid">
          <!-- Preset buttons injected via JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toastContainer" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm pointer-events-none transition-all duration-300 opacity-0 -translate-y-4">
    <div id="toastInner" class="bg-emerald-600 text-slate-950 font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 border border-emerald-400/40 pointer-events-auto">
      <svg class="w-5 h-5 shrink-0 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
      <div class="text-xs text-slate-950 font-semibold leading-snug flex-1" id="toastMessage">Workout saved!</div>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- PRESET EXERCISES ---
    const POPULAR_EXERCISES = [
      "Bench Press", "Barbell Squat", "Deadlift", 
      "Overhead Press", "Barbell Row", "Incline Dumbbell Press", 
      "Pull-Up", "Lat Pulldown", "Romanian Deadlift", 
      "Dumbbell Bicep Curl", "Tricep Rope Pushdown", "Lateral Raise", 
      "Leg Press", "Leg Curl", "Cable Fly"
    ];

    // --- APPLICATION STATE ---
    const STORAGE_KEY = 'iron_track_active_workout';
    const HISTORY_KEY = 'iron_track_history';

    let currentWorkout = {
      sessionId: generateId(),
      date: getTodayDateString(),
      name: '',
      exercises: []
    };

    // --- DOM REFERENCES ---
    const workoutView = document.getElementById('workoutView');
    const historyView = document.getElementById('historyView');
    const bottomBar = document.getElementById('bottomBar');
    const tabWorkoutBtn = document.getElementById('tabWorkoutBtn');
    const tabHistoryBtn = document.getElementById('tabHistoryBtn');
    const historyBadge = document.getElementById('historyBadge');
    
    const workoutDateInput = document.getElementById('workoutDate');
    const workoutNameInput = document.getElementById('workoutName');
    const presetChips = document.querySelectorAll('.preset-chip');
    const exercisesContainer = document.getElementById('exercisesContainer');
    const openAddExerciseBtn = document.getElementById('openAddExerciseBtn');
    const resetWorkoutBtn = document.getElementById('resetWorkoutBtn');
    
    const exerciseModal = document.getElementById('exerciseModal');
    const closeExerciseModalBtn = document.getElementById('closeExerciseModalBtn');
    const customExerciseInput = document.getElementById('customExerciseInput');
    const confirmCustomExerciseBtn = document.getElementById('confirmCustomExerciseBtn');
    const presetExerciseGrid = document.getElementById('presetExerciseGrid');
    
    const finishWorkoutBtn = document.getElementById('finishWorkoutBtn');
    const finishBtnText = document.getElementById('finishBtnText');
    const finishBtnSpinner = document.getElementById('finishBtnSpinner');
    const completedSetsCounter = document.getElementById('completedSetsCounter');
    const historyList = document.getElementById('historyList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    
    const toastContainer = document.getElementById('toastContainer');
    const toastMessage = document.getElementById('toastMessage');
    const saveIndicatorDot = document.getElementById('saveIndicatorDot');
    const saveStatusText = document.getElementById('saveStatusText');

    // --- INITIALIZATION ---
    function init() {
      renderPresetExercises();
      setupEventListeners();
      loadActiveWorkout();
      updateHistoryBadge();
    }

    function generateId() {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getTodayDateString() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    // --- POPULAR EXERCISES GRID ---
    function renderPresetExercises() {
      presetExerciseGrid.innerHTML = '';
      POPULAR_EXERCISES.forEach(name => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-left px-3 py-2.5 rounded-xl bg-slate-950 hover:bg-emerald-950/40 border border-slate-800 hover:border-emerald-500/50 text-slate-200 hover:text-emerald-300 text-xs font-medium transition-all min-h-[44px] flex items-center justify-between';
        btn.innerHTML = `<span>${escapeHtml(name)}</span><span class="text-emerald-500 font-bold text-sm">+</span>`;
        btn.addEventListener('click', () => {
          addExercise(name);
          closeModal();
        });
        presetExerciseGrid.appendChild(btn);
      });
    }

    // --- LOCAL STORAGE AUTO-SAVE ---
    function saveWorkoutState() {
      try {
        currentWorkout.date = workoutDateInput.value || getTodayDateString();
        currentWorkout.name = workoutNameInput.value.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentWorkout));
        
        // Show brief save indicator
        saveIndicatorDot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        saveStatusText.textContent = 'Auto-saved to device';
      } catch (err) {
        console.warn('LocalStorage save failed:', err);
      }
      updateSetsCounter();
    }

    function loadActiveWorkout() {
      let saved = null;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) saved = JSON.parse(raw);
      } catch (e) {
        console.warn('LocalStorage read error:', e);
      }

      if (saved && Array.isArray(saved.exercises) && (saved.exercises.length > 0 || saved.name)) {
        currentWorkout = saved;
        if (!currentWorkout.sessionId || !currentWorkout.sessionId.includes('-')) {
          currentWorkout.sessionId = generateId();
        }
      } else {
        // Fresh start
        currentWorkout = {
          sessionId: generateId(),
          date: getTodayDateString(),
          name: '',
          exercises: []
        };
      }

      workoutDateInput.value = currentWorkout.date || getTodayDateString();
      workoutNameInput.value = currentWorkout.name || '';
      highlightActivePresetChip(currentWorkout.name);
      renderExercises();
    }

    function highlightActivePresetChip(name) {
      presetChips.forEach(chip => {
        if (chip.getAttribute('data-name').toLowerCase() === (name || '').toLowerCase()) {
          chip.classList.add('bg-emerald-600', 'text-white');
          chip.classList.remove('bg-slate-800/80', 'text-slate-300');
        } else {
          chip.classList.remove('bg-emerald-600', 'text-white');
          chip.classList.add('bg-slate-800/80', 'text-slate-300');
        }
      });
    }

    // --- EXERCISE & SET MANAGEMENT ---
    function addExercise(name) {
      if (!name || !name.trim()) return;
      const newEx = {
        id: 'ex_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4),
        name: name.trim(),
        sets: [
          { id: 'set_1', weight: '', reps: '', done: false }
        ]
      };
      currentWorkout.exercises.push(newEx);
      saveWorkoutState();
      renderExercises();

      // Scroll to newly added exercise
      setTimeout(() => {
        const card = document.getElementById(`exCard_${newEx.id}`);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 50);
    }

    function removeExercise(exId) {
      currentWorkout.exercises = currentWorkout.exercises.filter(e => e.id !== exId);
      saveWorkoutState();
      renderExercises();
    }

    function addSet(exId) {
      const exercise = currentWorkout.exercises.find(e => e.id === exId);
      if (!exercise) return;

      // Pre-fill weight and reps from previous set if available
      let prevWeight = '';
      let prevReps = '';
      if (exercise.sets.length > 0) {
        const lastSet = exercise.sets[exercise.sets.length - 1];
        prevWeight = lastSet.weight || '';
        prevReps = lastSet.reps || '';
      }

      const newSet = {
        id: 'set_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 4),
        weight: prevWeight,
        reps: prevReps,
        done: false
      };
      exercise.sets.push(newSet);
      saveWorkoutState();
      renderExercises();
    }

    function removeSet(exId, setIndex) {
      const exercise = currentWorkout.exercises.find(e => e.id === exId);
      if (!exercise) return;
      exercise.sets.splice(setIndex, 1);
      // Ensure at least 1 set remains or allow 0 sets
      saveWorkoutState();
      renderExercises();
    }

    function toggleSetDone(exId, setIndex) {
      const exercise = currentWorkout.exercises.find(e => e.id === exId);
      if (!exercise || !exercise.sets[setIndex]) return;
      exercise.sets[setIndex].done = !exercise.sets[setIndex].done;
      saveWorkoutState();
      renderExercises();
    }

    function updateSetValue(exId, setIndex, field, value) {
      const exercise = currentWorkout.exercises.find(e => e.id === exId);
      if (!exercise || !exercise.sets[setIndex]) return;
      exercise.sets[setIndex][field] = value;
      saveWorkoutState();
    }

    // --- RENDER EXERCISES LIST ---
    function renderExercises() {
      if (currentWorkout.exercises.length === 0) {
        exercisesContainer.innerHTML = `
          <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-6 text-center space-y-2">
            <div class="w-10 h-10 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-slate-500">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <p class="text-sm font-semibold text-slate-300">No exercises added yet</p>
            <p class="text-xs text-slate-500">Tap "+ Add Exercise" below to begin logging your workout routine.</p>
          </div>
        `;
        updateSetsCounter();
        return;
      }

      exercisesContainer.innerHTML = '';
      currentWorkout.exercises.forEach((ex) => {
        const card = document.createElement('div');
        card.id = `exCard_${ex.id}`;
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3';

        // Card Header
        const cardHeader = document.createElement('div');
        cardHeader.className = 'flex items-center justify-between pb-2 border-b border-slate-800/70';
        cardHeader.innerHTML = `
          <div class="flex items-center gap-2">
            <div class="w-2 h-4 rounded-full bg-emerald-500"></div>
            <h3 class="text-sm font-bold text-white tracking-wide">${escapeHtml(ex.name)}</h3>
          </div>
          <button type="button" class="delete-ex-btn p-1.5 text-slate-500 hover:text-rose-400 rounded-lg hover:bg-slate-800 transition-colors min-h-[36px] min-w-[36px] flex items-center justify-center" title="Delete Exercise">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
            </svg>
          </button>
        `;
        cardHeader.querySelector('.delete-ex-btn').addEventListener('click', () => removeExercise(ex.id));
        card.appendChild(cardHeader);

        // Sets Table
        const setsTable = document.createElement('div');
        setsTable.className = 'space-y-2';

        // Column Labels
        const colHeader = document.createElement('div');
        colHeader.className = 'grid grid-cols-12 gap-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider px-1';
        colHeader.innerHTML = `
          <div class="col-span-2 text-center">Set</div>
          <div class="col-span-4 text-center">Weight</div>
          <div class="col-span-3 text-center">Reps</div>
          <div class="col-span-2 text-center">Done</div>
          <div class="col-span-1 text-center"></div>
        `;
        setsTable.appendChild(colHeader);

        // Sets Rows
        ex.sets.forEach((set, sIdx) => {
          const row = document.createElement('div');
          const isDone = Boolean(set.done);
          row.className = `grid grid-cols-12 gap-2 items-center p-1.5 rounded-xl border transition-all duration-150 ${
            isDone 
              ? 'bg-emerald-950/40 border-emerald-600/70 text-emerald-100 shadow-sm' 
              : 'bg-slate-950/80 border-slate-800/80 text-slate-100'
          }`;

          // Set Number
          const colSet = document.createElement('div');
          colSet.className = 'col-span-2 text-center font-bold text-xs';
          colSet.innerHTML = `<span class="inline-block px-1.5 py-0.5 rounded ${isDone ? 'bg-emerald-800/60 text-emerald-200' : 'bg-slate-800 text-slate-400'}">${sIdx + 1}</span>`;
          row.appendChild(colSet);

          // Weight Input (inputmode="decimal")
          const colWeight = document.createElement('div');
          colWeight.className = 'col-span-4';
          const weightInput = document.createElement('input');
          weightInput.type = 'number';
          weightInput.step = 'any';
          weightInput.inputMode = 'decimal';
          weightInput.placeholder = 'lbs/kg';
          weightInput.value = set.weight;
          weightInput.className = `w-full text-center font-semibold text-sm rounded-lg py-2 min-h-[44px] transition-all focus:outline-none border ${
            isDone 
              ? 'bg-emerald-950/60 border-emerald-600/60 text-emerald-100 focus:border-emerald-400' 
              : 'bg-slate-900 border-slate-800 text-white focus:border-emerald-500'
          }`;
          weightInput.addEventListener('input', (e) => {
            updateSetValue(ex.id, sIdx, 'weight', e.target.value);
          });
          colWeight.appendChild(weightInput);
          row.appendChild(colWeight);

          // Reps Input (inputmode="numeric")
          const colReps = document.createElement('div');
          colReps.className = 'col-span-3';
          const repsInput = document.createElement('input');
          repsInput.type = 'number';
          repsInput.inputMode = 'numeric';
          repsInput.placeholder = 'reps';
          repsInput.value = set.reps;
          repsInput.className = `w-full text-center font-semibold text-sm rounded-lg py-2 min-h-[44px] transition-all focus:outline-none border ${
            isDone 
              ? 'bg-emerald-950/60 border-emerald-600/60 text-emerald-100 focus:border-emerald-400' 
              : 'bg-slate-900 border-slate-800 text-white focus:border-emerald-500'
          }`;
          repsInput.addEventListener('input', (e) => {
            updateSetValue(ex.id, sIdx, 'reps', e.target.value);
          });
          colReps.appendChild(repsInput);
          row.appendChild(colReps);

          // Done Checkmark Button
          const colDone = document.createElement('div');
          colDone.className = 'col-span-2 flex justify-center';
          const doneBtn = document.createElement('button');
          doneBtn.type = 'button';
          doneBtn.className = `w-10 h-10 rounded-xl min-h-[44px] min-w-[40px] flex items-center justify-center transition-all ${
            isDone 
              ? 'bg-emerald-500 text-slate-950 shadow-md shadow-emerald-950/80 scale-105' 
              : 'bg-slate-900 border border-slate-750 text-slate-500 hover:text-slate-300 hover:border-slate-600'
          }`;
          doneBtn.innerHTML = `
            <svg class="w-5 h-5 font-black stroke-[3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
          `;
          doneBtn.addEventListener('click', () => toggleSetDone(ex.id, sIdx));
          colDone.appendChild(doneBtn);
          row.appendChild(colDone);

          // Delete Set Button
          const colDel = document.createElement('div');
          colDel.className = 'col-span-1 flex justify-center';
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'text-slate-600 hover:text-rose-400 p-1 min-h-[44px] min-w-[32px] flex items-center justify-center transition-colors';
          delBtn.innerHTML = `
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          `;
          delBtn.addEventListener('click', () => removeSet(ex.id, sIdx));
          colDel.appendChild(delBtn);
          row.appendChild(colDel);

          setsTable.appendChild(row);
        });

        card.appendChild(setsTable);

        // Add Set Button (pre-fills weight and reps)
        const addSetBtn = document.createElement('button');
        addSetBtn.type = 'button';
        addSetBtn.className = 'w-full py-2.5 rounded-xl bg-slate-950/70 hover:bg-slate-800/80 text-slate-300 hover:text-emerald-400 border border-slate-800/90 text-xs font-semibold flex items-center justify-center gap-1.5 min-h-[44px] transition-all';
        addSetBtn.innerHTML = `
          <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          <span>+ Add Set</span>
        `;
        addSetBtn.addEventListener('click', () => addSet(ex.id));
        card.appendChild(addSetBtn);

        exercisesContainer.appendChild(card);
      });

      updateSetsCounter();
    }

    function updateSetsCounter() {
      let totalSets = 0;
      let completedSets = 0;
      currentWorkout.exercises.forEach(ex => {
        ex.sets.forEach(set => {
          totalSets++;
          if (set.done) completedSets++;
        });
      });

      completedSetsCounter.textContent = `${completedSets} of ${totalSets} sets done`;
      if (completedSets > 0 && completedSets === totalSets) {
        completedSetsCounter.className = 'text-sm font-bold text-emerald-300 animate-pulse';
      } else {
        completedSetsCounter.className = 'text-sm font-bold text-emerald-400';
      }
    }

    // --- FINISH WORKOUT & DATA SYNC ---
    finishWorkoutBtn.addEventListener('click', async () => {
      // Gather all completed sets into flat JSON array
      const flatCompletedSets = [];
      const sessionDate = workoutDateInput.value || getTodayDateString();
      const sessionName = workoutNameInput.value.trim() || 'General Workout';
      const sessionId = currentWorkout.sessionId || generateId();

      currentWorkout.exercises.forEach(ex => {
        ex.sets.forEach((set, idx) => {
          if (set.done) {
            flatCompletedSets.push({
              session_id: sessionId,
              workout_date: sessionDate,
              workout_name: sessionName,
              exercise_name: ex.name,
              set_number: idx + 1,
              weight: parseFloat(set.weight) || 0,
              reps: parseInt(set.reps, 10) || 0
            });
          }
        });
      });

      if (flatCompletedSets.length === 0) {
        showToast('Please mark at least 1 completed set before finishing!');
        return;
      }

      // Enter loading state
      finishWorkoutBtn.disabled = true;
      finishBtnText.textContent = 'Saving & Syncing...';
      finishBtnSpinner.classList.remove('hidden');

      try {
        // Execute sync hook stub
        const result = await syncWorkoutData(flatCompletedSets);
        console.log('Sync result:', result);

        // Save session to local history (last 5 workouts)
        saveToHistory({
          id: sessionId,
          date: sessionDate,
          name: sessionName,
          totalSets: flatCompletedSets.length,
          exercisesSummary: currentWorkout.exercises.map(e => ({
            name: e.name,
            completedCount: e.sets.filter(s => s.done).length
          })),
          rows: flatCompletedSets,
          timestamp: new Date().toISOString()
        });

        // Show toast
        showToast(`Workout "${sessionName}" saved and synced successfully!`);

        // Clear active workout from localStorage
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch (e) {
          console.warn('Error clearing localStorage:', e);
        }

        // Reset screen for next workout
        currentWorkout = {
          sessionId: generateId(),
          date: getTodayDateString(),
          name: '',
          exercises: []
        };
        workoutDateInput.value = currentWorkout.date;
        workoutNameInput.value = '';
        highlightActivePresetChip('');
        renderExercises();
        updateHistoryBadge();

      } catch (err) {
        console.error('Workout sync failed:', err);
        showToast('Sync error: ' + (err.message || 'Check console'));
      } finally {
        finishWorkoutBtn.disabled = false;
        finishBtnText.textContent = 'Finish Workout';
        finishBtnSpinner.classList.add('hidden');
      }
    });

    // --- RECENT HISTORY STORAGE & VIEW ---
    function saveToHistory(workoutSummary) {
      try {
        let history = [];
        const raw = localStorage.getItem(HISTORY_KEY);
        if (raw) history = JSON.parse(raw);
        if (!Array.isArray(history)) history = [];

        // Prepend newest workout and keep top 5
        history.unshift(workoutSummary);
        if (history.length > 5) {
          history = history.slice(0, 5);
        }
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      } catch (e) {
        console.warn('Error saving history:', e);
      }
    }

    function getHistory() {
      try {
        const raw = localStorage.getItem(HISTORY_KEY);
        if (raw) {
          const list = JSON.parse(raw);
          if (Array.isArray(list)) return list;
        }
      } catch (e) {
        console.warn('Error reading history:', e);
      }
      return [];
    }

    function updateHistoryBadge() {
      const history = getHistory();
      historyBadge.textContent = history.length;
    }

    function renderHistory() {
      const history = getHistory();
      updateHistoryBadge();

      if (history.length === 0) {
        historyList.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 text-center space-y-2">
            <div class="w-12 h-12 mx-auto rounded-full bg-slate-800 flex items-center justify-center text-slate-500">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <h4 class="text-sm font-semibold text-slate-300">No History Yet</h4>
            <p class="text-xs text-slate-500">Complete and finish your first workout to see your history log here.</p>
          </div>
        `;
        return;
      }

      historyList.innerHTML = '';
      history.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md space-y-3';
        
        // Header
        const header = document.createElement('div');
        header.className = 'flex items-center justify-between pb-2 border-b border-slate-800/80';
        header.innerHTML = `
          <div>
            <div class="text-xs font-bold text-emerald-400 uppercase tracking-wider">${escapeHtml(item.date)}</div>
            <h3 class="text-sm font-bold text-white">${escapeHtml(item.name || 'Workout')}</h3>
          </div>
          <span class="px-2.5 py-1 bg-emerald-950/60 border border-emerald-800/60 text-emerald-300 rounded-full text-xs font-semibold">
            ${item.totalSets} completed sets
          </span>
        `;
        card.appendChild(header);

        // Exercises summary chips
        const exList = document.createElement('div');
        exList.className = 'space-y-1.5';
        if (item.rows && item.rows.length > 0) {
          // Group sets by exercise
          const exMap = {};
          item.rows.forEach(r => {
            if (!exMap[r.exercise_name]) exMap[r.exercise_name] = [];
            exMap[r.exercise_name].push(r);
          });

          Object.keys(exMap).forEach(exName => {
            const exSets = exMap[exName];
            const rowDiv = document.createElement('div');
            rowDiv.className = 'bg-slate-950/60 rounded-xl p-2.5 border border-slate-800/60 flex items-center justify-between text-xs';
            
            const setsDetails = exSets.map(s => `${s.weight > 0 ? s.weight : 'BW'}×${s.reps}`).join(', ');
            rowDiv.innerHTML = `
              <span class="font-semibold text-slate-200">${escapeHtml(exName)}</span>
              <span class="text-slate-400 font-mono text-[11px]">${escapeHtml(setsDetails)}</span>
            `;
            exList.appendChild(rowDiv);
          });
        }
        card.appendChild(exList);

        historyList.appendChild(card);
      });
    }

    clearHistoryBtn.addEventListener('click', () => {
      try {
        localStorage.removeItem(HISTORY_KEY);
      } catch (e) {}
      renderHistory();
      showToast('Workout history cleared');
    });

    // --- TAB SWITCHING ---
    tabWorkoutBtn.addEventListener('click', () => {
      workoutView.classList.remove('hidden');
      historyView.classList.add('hidden');
      bottomBar.classList.remove('hidden');

      tabWorkoutBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm bg-emerald-600 text-white min-h-[36px] flex items-center gap-1.5';
      tabHistoryBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 min-h-[36px] flex items-center gap-1.5';
    });

    tabHistoryBtn.addEventListener('click', () => {
      workoutView.classList.add('hidden');
      historyView.classList.remove('hidden');
      bottomBar.classList.add('hidden');

      tabHistoryBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm bg-emerald-600 text-white min-h-[36px] flex items-center gap-1.5';
      tabWorkoutBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all text-slate-400 hover:text-slate-200 min-h-[36px] flex items-center gap-1.5';
      
      renderHistory();
    });

    // --- EVENT LISTENERS & MODAL CONTROLS ---
    function setupEventListeners() {
      // Date Picker changes
      workoutDateInput.addEventListener('change', saveWorkoutState);

      // Workout Name changes
      workoutNameInput.addEventListener('input', () => {
        highlightActivePresetChip(workoutNameInput.value.trim());
        saveWorkoutState();
      });

      // Routine Quick Preset Chips
      presetChips.forEach(chip => {
        chip.addEventListener('click', () => {
          const name = chip.getAttribute('data-name');
          workoutNameInput.value = name;
          highlightActivePresetChip(name);
          saveWorkoutState();
        });
      });

      // Clear / Reset Active Workout
      resetWorkoutBtn.addEventListener('click', () => {
        if (currentWorkout.exercises.length > 0 || workoutNameInput.value) {
          // Reset workout state
          currentWorkout = {
            sessionId: generateId(),
            date: getTodayDateString(),
            name: '',
            exercises: []
          };
          workoutDateInput.value = currentWorkout.date;
          workoutNameInput.value = '';
          highlightActivePresetChip('');
          saveWorkoutState();
          renderExercises();
          showToast('Workout cleared');
        }
      });

      // Modal Open/Close
      function openModal() {
        exerciseModal.style.setProperty('display', 'flex', 'important');
        customExerciseInput.value = '';
        setTimeout(() => customExerciseInput.focus(), 100);
      }

      openAddExerciseBtn.addEventListener('click', openModal);
      openAddExerciseBtn.addEventListener('touchend', (e) => {
        e.preventDefault();
        openModal();
      });

      closeExerciseModalBtn.addEventListener('click', closeModal);
      exerciseModal.addEventListener('click', (e) => {
        if (e.target === exerciseModal) closeModal();
      });

      confirmCustomExerciseBtn.addEventListener('click', () => {
        const val = customExerciseInput.value.trim();
        if (val) {
          addExercise(val);
          closeModal();
        }
      });

      customExerciseInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = customExerciseInput.value.trim();
          if (val) {
            addExercise(val);
            closeModal();
          }
        }
      });
    }

    function closeModal() {
      exerciseModal.style.setProperty('display', 'none', 'important');
    }

    // --- TOAST NOTIFICATIONS ---
    let toastTimeout = null;
    function showToast(msg) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMessage.textContent = msg;
      toastContainer.classList.remove('opacity-0', '-translate-y-4');
      toastContainer.classList.add('opacity-100', 'translate-y-0');
      
      toastTimeout = setTimeout(() => {
        toastContainer.classList.remove('opacity-100', 'translate-y-0');
        toastContainer.classList.add('opacity-0', '-translate-y-4');
      }, 3500);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

        // --- SYNC CONFIGURATION ---
    const SUPABASE_URL = "https://wzyvionyeckuhuchqdzr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6eXZpb255ZWNrdWh1Y2hxZHpyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxODE5MjIsImV4cCI6MjEwOTc1NzkyMn0.dOkfD0UHGZTBrm0gU8CBQQ0MChbfJ0A_PtG3tmZ4mM8";
    const GOOGLE_SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzSJi3aTDeU9RGVk5U6f5ErPmCi6dS--5xPCFdSGhpYOJTuCEYHZ7KOFrvqo5pg2L3r/exec";

    async function syncWorkoutData(rows) {
      if (!rows || rows.length === 0) {
        throw new Error("No completed sets to save.");
      }

      // 1. Save to Supabase (workout_logs table)
      const supabaseResponse = await fetch(`${SUPABASE_URL}/rest/v1/workout_logs`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(rows)
      });

      if (!supabaseResponse.ok) {
        const errText = await supabaseResponse.text();
        throw new Error(`Supabase sync failed: ${errText}`);
      }

      // 2. Send to Google Sheets via Apps Script Web App
      await fetch(GOOGLE_SHEET_WEBHOOK_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(rows)
      });

      return true;
    }

    // Run on startup
    window.addEventListener('DOMContentLoaded', init);
  </script>
